<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>R.E.P.O. Game</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      min-height: 100vh;
      background: #24292e;
      color: #fff;
      font-family: Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .container {
      width: 100vw;
      min-height: 100vh;
      max-width: 100vw;
      box-sizing: border-box;
      padding: 0;
      margin: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #1b1f23;
    }
    .content {
      width: 94vw;
      max-width: 500px;
      background: #22272e;
      padding: 2em 1em;
      border-radius: 12px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.18);
      display: flex;
      flex-direction: column;
      align-items: stretch;
      margin: 2vw 0;
    }
    h1 {
      text-align: center;
      color: #fff;
      font-size: 2.1em;
      margin-bottom: 1em;
      letter-spacing: 1px;
    }
    .score, .result, .final {
      text-align: center;
      margin: 1em 0 0.7em 0;
      font-size: 1.1em;
      word-break: break-word;
    }
    .result.correct { color: #2ea44f; }
    .result.incorrect { color: #f9826c; }
    .question {
      font-size: 1.15em;
      margin: 1em 0 0.3em 0;
      min-height: 48px;
      text-align: center;
    }
    input[type="text"] {
      width: 100%;
      padding: 0.7em;
      font-size: 1.1em;
      margin: 0.8em 0;
      border-radius: 6px;
      border: 1px solid #374151;
      background: #181c21;
      color: #fff;
      outline: none;
      box-sizing: border-box;
      transition: border 0.2s;
    }
    input[type="text"]:focus {
      border: 1.5px solid #fff;
    }
    button {
      padding: 0.7em 1em;
      font-size: 1.1em;
      margin: 0.5em 0 0 0;
      background: #2ea44f;
      color: #fff;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      transition: background 0.2s;
      width: 100%;
      max-width: 300px;
      align-self: center;
    }
    button:hover, button:focus {
      background: #22863a;
    }
    @media (max-width: 600px) {
      .content {
        max-width: 98vw;
        padding: 1.2em 0.4em;
        border-radius: 0;
        box-shadow: none;
      }
      h1 {
        font-size: 1.3em;
      }
      .question {
        font-size: 1em;
        min-height: 42px;
      }
      button {
        font-size: 1em;
        max-width: 100vw;
      }
      input[type="text"] {
        font-size: 1em;
        padding: 0.5em;
      }
    }
    @media (max-width: 400px) {
      .content {
        padding: 0.5em 0.1em;
      }
      h1 {
        font-size: 1em;
      }
    }
  </style>
</head>

<body>
  <div class="container">
    <div class="content">
      <h1>R.E.P.O. Game</h1>
      <div class="score" id="score"></div>
      <div class="question" id="question"></div>
      <input type="text" id="answer" placeholder="Type your answer here..."
        autocomplete="off" required>
      <button id="submitBtn" onclick="handleButtonClick()">Submit</button>
      <div class="result" id="result"></div>
      <div class="final" id="final"></div>
    </div>
  </div>
  <script>
    const questions = [
      {
        question: "What command initializes a new Git repository?",
        answer: "git init"
      },
      {
        question: "How do you stage all files for commit?",
        answer: "git add ."
      },
      {
        question: "What command commits staged changes with a message?",
        answer: "git commit -m 'message'"
      },
      {
        question: "How do you check the status of your repo?",
        answer: "git status"
      },
      {
        question: "What command creates a new branch named 'feature'?",
        answer: "git branch feature"
      },
      {
        question: "How do you switch to the branch 'main'?",
        answer: "git checkout main"
      },
      {
        question: "How do you push your commits to the remote repository?",
        answer: "git push"
      },
      {
        question: "What command pulls the latest changes from the remote repo?",
        answer: "git pull"
      }
    ];
    
    let current = 0;
    let score = 0;
    let isAnswered = false;
    let shuffled = questions.slice().sort(() => 0.5 - Math.random());
    
    function showQuestion() {
      document.getElementById('question').textContent = shuffled[current].question;
      document.getElementById('answer').value = '';
      document.getElementById('answer').disabled = false;
      document.getElementById('submitBtn').disabled = false;
      document.getElementById('submitBtn').textContent = "Submit";
      document.getElementById('result').textContent = '';
      document.getElementById('result').className = 'result';
      document.getElementById('score').textContent = `Score: ${score}/${shuffled.length}`;
      document.getElementById('final').textContent = '';
      isAnswered = false;
      document.getElementById('answer').focus();
    }
    
    function submitAnswer() {
      const answerInput = document.getElementById('answer');
      if (!answerInput.value.trim()) {
        answerInput.focus();
        return;
      }
      let userAns = answerInput.value.trim().toLowerCase();
      let correctAns = shuffled[current].answer.toLowerCase();
      let result = document.getElementById('result');
      if (userAns === correctAns) {
        result.textContent = "Correct!";
        result.className = "result correct";
        score++;
      } else {
        result.textContent = `Incorrect. The correct answer is: ${shuffled[current].answer}`;
        result.className = "result incorrect";
      }
      answerInput.disabled = true;
      isAnswered = true;
      document.getElementById('submitBtn').textContent = "Next Question";
    }
    
    function nextQuestion() {
      current++;
      if (current < shuffled.length) {
        showQuestion();
      } else {
        document.getElementById('question').textContent = '';
        document.getElementById('answer').style.display = 'none';
        document.getElementById('submitBtn').style.display = 'none';
        document.getElementById('result').textContent = '';
        document.getElementById('final').textContent = `Game Over! Final score: ${score}/${shuffled.length}`;
      }
    }
    
    function handleButtonClick() {
      if (!isAnswered) {
        submitAnswer();
      } else {
        nextQuestion();
      }
    }
    
    // Allow Enter key to trigger button click
    document.getElementById('answer').addEventListener('keydown', function(e) {
      if (e.key === "Enter" && !document.getElementById('submitBtn').disabled) {
        handleButtonClick();
      }
    });
    
    // Start the game
    showQuestion();
  </script>
</body>

</html>
